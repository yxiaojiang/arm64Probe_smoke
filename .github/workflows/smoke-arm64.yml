# ============================================================================
# ARM64 冒烟测试工作流（自包含版，无需仓库内 smoke.sh）
# 在真 ARM64 硬件（Cobalt 100, 4 vCPU/16GB）上运行打包产物
# - 公开仓库: 免费且无限量；私有仓库: 消耗免费分钟额度（2000 分钟/月）
# 触发方式: 手动 (Actions 页面 -> Run workflow) 或 push 到 main/master
# 要求: 仓库 Release 中必须有 Arm64Probe-LinuxAArch64.tar.gz
# ============================================================================
name: ARM64 Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  smoke:
    runs-on: ubuntu-24.04-arm        # 真 ARM64 runner
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 从 Release 下载产物包
        run: |
          set -e
          curl -fL --retry 3 -o Arm64Probe-LinuxAArch64.tar.gz \
            "https://github.com/${{ github.repository }}/releases/latest/download/Arm64Probe-LinuxAArch64.tar.gz"
          ls -lh Arm64Probe-LinuxAArch64.tar.gz

      - name: 解压并校验 ELF
        run: |
          tar -xzf Arm64Probe-LinuxAArch64.tar.gz
          echo "=== ELF 校验 ==="
          file Arm64Probe/Binaries/LinuxAArch64/Arm64Probe
          readelf -h Arm64Probe/Binaries/LinuxAArch64/Arm64Probe | grep -E "Class|Machine|Type" || true

      - name: 运行冒烟测试
        run: |
          set +e
          BIN_DIR="Arm64Probe/Binaries/LinuxAArch64"
          LOGS="$GITHUB_WORKSPACE/logs"
          mkdir -p "$LOGS"

          echo "=== [1] 安装无头运行依赖 ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libsdl2-2.0-0 >/dev/null 2>&1 || true

          echo "=== [2] 无头启动（-nullrhi, 超时 180s）==="
          chmod +x "$BIN_DIR/Arm64Probe"
          export SDL_VIDEODRIVER=dummy
          export SDL_AUDIODRIVER=dummy
          cd "$BIN_DIR"                                  # 与官方 .sh 启动脚本一致
          START=$(date +%s)
          timeout 180 xvfb-run -a ./Arm64Probe -nullrhi -noaudio -nosound -unattended -log \
            > "$LOGS/console.log" 2>&1
          RC=$?
          END=$(date +%s)
          cd "$GITHUB_WORKSPACE"
          echo "运行时长: $((END-START))s   退出码: $RC (124=超时自动终止, 属预期)"
          # 关键修复：xvfb-run 收到 SIGTERM 后会先退出，Arm64Probe 子进程仍在后台优雅关闭并 flush stdout；
          # 立即汇总会拿到截断日志（缺 "Game Engine Initialized"）→ 误判 FAIL。等待日志完整落盘。
          sleep 5

          echo "=== [3] 汇总 UE 日志 ==="
          cp -r "$HOME/Documents/Arm64Probe/Saved/Logs/." "$LOGS/" 2>/dev/null || true
          cat "$LOGS"/*.log 2>/dev/null > "$LOGS/all.log"
          tail -60 "$LOGS/all.log"

          echo "=== [4] 判定 ==="
          RESULT=PASS
          # 判定同时 grep console.log（stdout 直出）与 all.log（汇总），任一命中即有效，避免单文件截断
          # 4a. 致命错误/崩溃信号 → 直接 FAIL（真·运行时问题）
          if grep -qiE "Fatal error|Assertion failed|Segmentation fault|signal SIG|Check failed|LogExit: Fatal" "$LOGS/console.log" "$LOGS/all.log"; then
            RESULT=FAIL; echo "❌ 检测到致命错误/崩溃"
          fi
          # 4b. 引擎初始化（核心目标：产物能否在 ARM64 启动）
          ENGINE_OK=0
          if grep -qiE "Game Engine Initialized|LogInit: Display:.*Initialized" "$LOGS/console.log" "$LOGS/all.log"; then
            ENGINE_OK=1; echo "✅ 引擎初始化成功（产物可在 ARM64 正常启动）"
          else
            RESULT=FAIL; echo "⚠️ 未检测到引擎初始化标记"
          fi
          # 4c. pak 挂载
          if grep -qiE "LogPakFile.*[Mm]ount" "$LOGS/console.log" "$LOGS/all.log"; then
            echo "✅ pak 挂载成功"
          else
            echo "⚠️ 未检测到 pak 挂载日志"
          fi
          # 4d. D1 地图加载（本次重打包核心目标：验证 D1 在 ARM64 正常加载 → 缺失判 FAIL）
          if grep -qiE "Bringing World .*D1|LoadMap.*D1" "$LOGS/console.log" "$LOGS/all.log"; then
            echo "✅ 默认地图 D1 加载成功"
          else
            RESULT=FAIL; echo "❌ 未检测到 D1 地图加载日志（D1 可能未进 pak 或加载失败）"
          fi
          # 4e. 地图缺失 = 内容问题（空工程未 cook 默认地图），非运行时崩溃 → 提示不判 FAIL
          if grep -qiE "could not be found. Exiting|Failed to enter" "$LOGS/console.log" "$LOGS/all.log"; then
            echo "⚠️ 默认地图缺失（内容问题）：引擎正常初始化后因找不到 GameDefaultMap 退出，非运行时崩溃"
          fi
          # 4f. 运行时长：仅当引擎未初始化成功且运行过短，才判 FAIL（正常快速退出不误伤）
          if [ "$ENGINE_OK" = "0" ] && [ $((END-START)) -lt 10 ]; then
            RESULT=FAIL; echo "⚠️ 引擎未初始化且运行不足 10 秒"
          fi
          echo "SMOKE_RESULT=$RESULT" >> "$GITHUB_ENV"
          echo "=== 判定结果: $RESULT ==="

      - name: 上传完整日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ue-logs
          path: logs/
          if-no-files-found: warn

      - name: 汇总冒烟结果
        if: always()
        run: |
          echo "冒烟结果: ${{ env.SMOKE_RESULT }}"
          if [ "${{ env.SMOKE_RESULT }}" = "FAIL" ]; then
            echo "❌ 冒烟未通过，请下载 ue-logs 工件查看完整日志"
            exit 1
          fi
          echo "✅ 冒烟通过"
